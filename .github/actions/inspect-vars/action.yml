name: 'Inspect Variables Action'
description: 'Demonstrates how a custom action receives inputs and environment variables'

inputs:
  explicit_input:
    description: 'Variable passed explicitly via with:'
    required: true
  repo_wide_var:
    description: 'Repo variable passed from workflow context into action input'
    required: false
    default: 'not-set'

runs:
  using: 'composite'
  steps:
    - name: Read Variables Inside Action
      shell: bash
      env:
        # Map action inputs to local shell environment variables
        MAPPED_INPUT_ENV: ${{ inputs.explicit_input }}
        MAPPED_REPO_VAR: ${{ inputs.repo_wide_var }}
      run: |
        echo "--- Inside Custom Composite Action ---"
        echo "1. Passed via input (explicit_input): $MAPPED_INPUT_ENV"
        echo "2. Passed via input (repo_wide_var):  $MAPPED_REPO_VAR"
        echo "3. Passed via caller step env:        $STEP_PASSED_REPO_VAR"
        echo "4. Inherited from Job/Workflow env:   $WORKFLOW_LEVEL_ENV"
        echo "5. Dynamic var from GITHUB_ENV:       $DYNAMIC_STEP_VAR"
