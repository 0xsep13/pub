name: 'Inspect Variables Action'
description: 'Demonstrates how a custom action receives inputs and environment variables'

inputs:
  explicit_input:
    description: 'Variable passed explicitly via with:'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Read Variables Inside Action
      shell: bash
      env:
        # Map the action input to a local shell environment variable (Best Practice)
        MAPPED_INPUT_ENV: ${{ inputs.explicit_input }}
      run: |
        echo "--- Inside Custom Composite Action ---"
        echo "1. Passed via input (mapped to env): $MAPPED_INPUT_ENV"
        echo "2. Inherited from Job/Workflow env:  $WORKFLOW_LEVEL_ENV"
        echo "3. Dynamic var from GITHUB_ENV:      $DYNAMIC_STEP_VAR"
        echo "4. Direct repo var context access:   ${{ vars.REPO_WIDE_VAR }}"
